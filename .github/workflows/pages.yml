name: Deploy Pages (student+admin)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable Corepack & install pnpm@9
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm -v

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install deps (workspace)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Set env (Supabase)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}" >> $GITHUB_ENV
          echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}" >> $GITHUB_ENV

      - name: Build student
        run: pnpm --filter ./apps/student build

      - name: Build admin
        run: pnpm --filter ./apps/admin build

      - name: Assemble Pages artifact
        run: |
          mkdir -p dist-pages/student dist-pages/admin
          cp -R apps/student/dist/* dist-pages/student/
          cp -R apps/admin/dist/* dist-pages/admin/
          echo '<meta http-equiv="refresh" content="0; url=./student/"/>' > dist-pages/index.html
          echo '<meta http-equiv="refresh" content="0; url=./student/"/>' > dist-pages/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
